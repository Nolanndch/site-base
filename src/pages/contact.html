---
title: Contact
description: Une question ou un projet ? Envoyez-nous un message via le formulaire, nous vous répondons sous 48 heures ouvrées.
---
<section class="section">
  <div class="container container--narrow">
    <h1>Contact</h1>
    <form class="form" method="post" action="{{ site.form.endpoint }}" data-form-guard data-min-fill-ms="{{ site.form.minFillMs }}">
      <div class="field">
        <label for="name">Nom</label>
        <input id="name" name="name" type="text" autocomplete="name" required maxlength="100">
      </div>
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required minlength="10" maxlength="5000"></textarea>
      </div>

      <div class="hp" aria-hidden="true">
        <label>Ne pas remplir ce champ <input type="text" name="website" tabindex="-1" autocomplete="off" data-honeypot></label>
      </div>

      <div class="field field--check">
        <input id="consent" name="consent" type="checkbox" required>
        <label for="consent">J'accepte que mes données soient utilisées pour répondre à ma demande, conformément à la <a href="/politique-confidentialite/">politique de confidentialité</a>.</label>
      </div>

      <div>
        <button class="btn" type="submit">Envoyer</button>
      </div>
      <p class="form__status" role="status" aria-live="polite" data-form-status></p>
    </form>
  </div>
</section>
