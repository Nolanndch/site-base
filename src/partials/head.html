<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ meta.title }}</title>
<meta name="description" content="{{ meta.description }}">
<meta name="robots" content="{{ meta.robots }}">
{{#if meta.canonical}}<link rel="canonical" href="{{ meta.canonical }}">{{/if}}
<meta name="theme-color" content="{{ site.themeColor }}">
<meta name="color-scheme" content="light dark">

<!-- Favicons -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Open Graph -->
<meta property="og:type" content="{{ meta.ogType }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="{{ site.locale }}">
<meta property="og:title" content="{{ meta.title }}">
<meta property="og:description" content="{{ meta.description }}">
<meta property="og:image" content="{{ meta.image }}">
<meta property="og:image:alt" content="{{ meta.imageAlt }}">
{{#if meta.canonical}}<meta property="og:url" content="{{ meta.canonical }}">{{/if}}

<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ meta.title }}">
<meta name="twitter:description" content="{{ meta.description }}">
<meta name="twitter:image" content="{{ meta.image }}">
{{#if site.twitter}}<meta name="twitter:site" content="{{ site.twitter }}">{{/if}}

<!-- Polices auto-hébergées : déclarer dans site.config.json > fonts.preload -->
{{{ fontPreloads }}}

<link rel="stylesheet" href="/assets/css/main.css?v={{ build.version }}">
<script type="module" src="/assets/js/main.js?v={{ build.version }}"></script>

{{#if meta.jsonld}}<script type="application/ld+json">{{{ meta.jsonld }}}</script>{{/if}}
